<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Погода</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--tg-theme-bg-color, #ffffff);
      color: var(--tg-theme-text-color, #000000);
      padding: 24px 16px;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    h1 { font-size: 24px; margin-bottom: 24px; }
    .input-group { width: 100%; max-width: 400px; display: flex; flex-direction: column; gap: 12px; }
    input {
      width: 100%;
      padding: 14px 16px;
      font-size: 16px;
      border: 1px solid var(--tg-theme-hint-color, #ccc);
      border-radius: 12px;
      background: var(--tg-theme-secondary-bg-color, #f5f5f5);
      color: var(--tg-theme-text-color, #000);
      outline: none;
    }
    input:focus { border-color: var(--tg-theme-button-color, #2481cc); }
    button {
      width: 100%;
      padding: 14px;
      font-size: 16px;
      font-weight: 600;
      border: none;
      border-radius: 12px;
      background: var(--tg-theme-button-color, #2481cc);
      color: var(--tg-theme-button-text-color, #ffffff);
      cursor: pointer;
    }
    button:active { opacity: 0.85; }
  </style>
</head>
<body>
  <h1>🌤 Погода</h1>
  
  <div class="input-group">
    <input type="text" id="cityInput" placeholder="Введите город" autocomplete="off">
    <button onclick="sendCity()">Показать погоду</button>
  </div>

  <script>
    const tg = window.Telegram.WebApp;
    tg.ready();
    tg.expand();

    const input = document.getElementById('cityInput');
    input.focus();

    input.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') sendCity();
    });

    function sendCity() {
      const city = input.value.trim();
      if (!city) {
        tg.showAlert('Введите название города');
        return;
      }
      tg.sendData(JSON.stringify({ action: 'weather', city: city }));
    }
  </script>
</body>
</html>
